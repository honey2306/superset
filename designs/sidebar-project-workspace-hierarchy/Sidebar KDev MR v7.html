      html,body,#root{width:100%;min-width:1100px;height:100%;margin:0;overflow:hidden;background:var(--page-bg)}*{box-sizing:border-box}button,input,textarea{font:inherit}button{border:0;cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:0;box-shadow:var(--focus-ring)}
      .v7-app{height:100%;display:grid;grid-template-rows:34px minmax(0,1fr) 24px;color:var(--fg);background:var(--page-bg)}.v7-chrome{display:grid;grid-template-columns:170px minmax(0,1fr) auto;align-items:center;gap:var(--s-5);padding:0 var(--s-5);border-bottom:1px solid var(--line);background:color-mix(in oklch,var(--page-bg) 90%,#000 10%)}.v7-lights,.v7-tabs,.v7-icon-row,.v7-header-actions,.v7-status{display:flex;align-items:center}.v7-lights{gap:7px;padding-left:var(--s-2)}.v7-light{width:11px;height:11px;border-radius:var(--r-pill)}.v7-light:nth-child(1){background:#ff5f57}.v7-light:nth-child(2){background:#febc2e}.v7-light:nth-child(3){background:#28c840}.v7-tabs{gap:2px;min-width:0}.v7-tab{height:24px;max-width:220px;display:inline-flex;align-items:center;gap:var(--s-3);padding:0 var(--s-4);border-radius:var(--r-3);color:var(--fg-faint);background:transparent;font:var(--fs-10) var(--font-mono);overflow:hidden;white-space:nowrap}.v7-tab.current{color:var(--fg);background:var(--surface)}.v7-icon-row{gap:2px;color:var(--fg-faint)}.v7-icon-button{width:26px;height:26px;display:grid;place-items:center;border-radius:var(--r-pill);color:inherit;background:transparent}.v7-tab:hover,.v7-icon-button:hover,.v7-rail-button:hover{color:var(--fg);background:var(--hover)}

ice.independent{margin:0 var(--s-1);width:calc(100% - var(--s-2))}.v7-toast{position:fixed;right:var(--s-8);bottom:var(--s-10);z-index:var(--z-toast);animation:v7-toast-in 220ms var(--ease-standard)}
