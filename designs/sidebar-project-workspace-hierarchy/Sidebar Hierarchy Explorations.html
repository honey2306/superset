<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sidebar Hierarchy Explorations</title>
    <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="_ds/superset-design-system/tokens/colors.css">
    <link rel="stylesheet" href="_ds/superset-design-system/tokens/typography.css">
    <link rel="stylesheet" href="_ds/superset-design-system/tokens/spacing.css">
    <link rel="stylesheet" href="_ds/superset-design-system/tokens/radius.css">
    <link rel="stylesheet" href="_ds/superset-design-system/tokens/shadow.css">
    <link rel="stylesheet" href="_ds/superset-design-system/tokens/motion.css">
    <link rel="stylesheet" href="_ds/superset-design-system/tokens/z-index.css">
    <link rel="stylesheet" href="_ds/superset-design-system/tokens/opacity.css">
    <link rel="stylesheet" href="_ds/superset-design-system/tokens/border-width.css">
    <link rel="stylesheet" href="_ds/superset-design-system/tokens/focus.css">
    <link rel="stylesheet" href="_ds/superset-design-system/tokens/reset.css">
    <link rel="stylesheet" href="_ds/superset-design-system/styles.css">
    <style>
      body { min-width: 320px; }
      button { -webkit-tap-highlight-color: transparent; }
      .comparison-page { min-height: 100vh; padding: var(--s-12); background: var(--page-bg); }
      .comparison-header { max-width: 1200px; margin: 0 auto var(--s-10); display: flex; align-items: end; justify-content: space-between; gap: var(--s-8); }
      .comparison-kicker { margin: 0 0 var(--s-2); color: var(--fg-faint); font-family: var(--font-mono); font-size: var(--fs-10); letter-spacing: .06em; text-transform: uppercase; }
      .comparison-title { margin: 0; font-size: var(--fs-18); font-weight: var(--fw-semibold); letter-spacing: -.01em; }
      .comparison-note { margin: var(--s-1) 0 0; color: var(--fg-mute); font-size: var(--fs-12); }
      .variant-tabs { display: none; gap: var(--s-2); }
      .variant-tab { min-width: 30px; height: 26px; border: var(--bw-hairline) solid var(--line); border-radius: var(--r-pill); color: var(--fg-mute); font: var(--fw-semibold) var(--fs-11) var(--font-mono); transition: background var(--dur-quick) var(--ease-standard), color var(--dur-quick) var(--ease-standard), border-color var(--dur-quick) var(--ease-standard); }
      .variant-tab:hover, .variant-tab.active { background: var(--accent-tint); border-color: var(--accent-line); color: var(--fg); }
      .variant-tab:focus-visible, .icon-btn:focus-visible, .workspace-row:focus-visible { outline: none; box-shadow: var(--focus-ring); }
      .variant-grid { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s-8); align-items: start; }
      .variant-card { min-width: 0; }
      .variant-meta { min-height: 45px; margin-bottom: var(--s-4); display: grid; grid-template-columns: 28px minmax(0, 1fr); column-gap: var(--s-3); align-items: start; }
      .variant-letter { width: 26px; height: 26px; display: grid; place-items: center; border: var(--bw-hairline) solid var(--line-strong); border-radius: var(--r-pill); color: var(--fg); font: var(--fw-semibold) var(--fs-11) var(--font-mono); }
      .variant-label { margin: 0; color: var(--fg); font-size: var(--fs-12); font-weight: var(--fw-semibold); }
      .variant-rationale { margin: 1px 0 0; color: var(--fg-mute); font-size: var(--fs-10); line-height: 1.45; }
      .artboard-shell { overflow: hidden; border: var(--bw-hairline) solid var(--line-strong); border-radius: var(--r-7); background: var(--surface-elev); box-shadow: var(--shadow-2); }
      .sidebar-artboard { width: 100%; min-height: 590px; background: var(--surface); }
      .sidebar-topbar { height: 38px; display: flex; align-items: center; justify-content: space-between; padding: 0 var(--s-4) 0 var(--s-5); border-bottom: var(--bw-hairline) solid var(--line); background: var(--surface-elev); }
      .sidebar-title { display: flex; align-items: center; gap: var(--s-3); color: var(--fg-mute); font-size: var(--fs-11); font-weight: var(--fw-medium); }
      .title-dot { width: 6px; height: 6px; border-radius: var(--r-pill); background: var(--accent); }
      .sidebar-actions { display: flex; align-items: center; gap: 1px; }
      .icon-btn { display: inline-grid; width: 24px; height: 24px; place-items: center; border-radius: var(--r-pill); color: var(--fg-faint); transition: background var(--dur-quick) var(--ease-standard), color var(--dur-quick) var(--ease-standard); }
      .icon-btn:hover { background: var(--hover); color: var(--fg); }
      .sidebar-body { padding: var(--s-4); }
      .project-header { min-width: 0; display: flex; align-items: center; gap: var(--s-2); color: var(--fg); }
      .project-chevron { display: inline-grid; width: 18px; height: 20px; place-items: center; flex: 0 0 auto; border-radius: var(--r-pill); color: var(--fg-faint); transition: transform var(--dur-quick) var(--ease-standard), background var(--dur-quick) var(--ease-standard), color var(--dur-quick) var(--ease-standard); }
      .project-chevron:hover { background: var(--hover); color: var(--fg); }
      .project-chevron.closed { transform: rotate(-90deg); }
      .project-heading { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--fs-12); font-weight: var(--fw-semibold); }
      .project-count { color: var(--fg-faint); font: var(--fs-10) var(--font-mono); }
      .project-plus { margin-left: auto; }
      .workspace-row { width: 100%; min-width: 0; display: block; text-align: left; border-radius: var(--r-3); color: var(--fg-mute); transition: background var(--dur-quick) var(--ease-standard), color var(--dur-quick) var(--ease-standard); }
      .workspace-row:hover { background: var(--hover); color: var(--fg); }
      .workspace-row.active { background: var(--accent-tint); color: var(--fg); }
      .workspace-name { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--fs-12); font-weight: var(--fw-medium); }
      .workspace-branch { display: block; overflow: hidden; color: var(--fg-faint); font: var(--fs-10) var(--font-mono); line-height: 1.3; text-overflow: ellipsis; white-space: nowrap; }
      .workspace-row.active .workspace-branch { color: var(--accent-2); }
      .panel-project { margin-bottom: var(--s-4); padding: var(--s-3); border: var(--bw-hairline) solid var(--line); border-radius: var(--r-5); background: var(--surface-elev); }
      .panel-project:last-child { margin-bottom: 0; }
      .panel-project .project-header { min-height: 24px; }
      .panel-workspace-list { margin: var(--s-3) 0 0 var(--s-5); padding: var(--s-2); border: var(--bw-hairline) solid var(--line); border-radius: var(--r-4); background: var(--surface-sunk); }
      .panel-workspace-list .workspace-row { padding: var(--s-2) var(--s-3); }
      .panel-workspace-list .workspace-row + .workspace-row { margin-top: 1px; }
      .outline-project { position: relative; margin-bottom: var(--s-10); }
      .outline-project:last-child { margin-bottom: 0; }
      .outline-project .project-header { min-height: 24px; }
      .outline-rail { position: relative; margin: var(--s-2) 0 0 9px; padding-left: var(--s-5); border-left: var(--bw-hairline) solid var(--line-strong); }
      .outline-rail::before { content: ""; position: absolute; top: 16px; left: -1px; height: 14px; border-left: var(--bw-hairline) solid var(--accent-line); }
      .outline-rail .workspace-row { position: relative; padding: var(--s-2) var(--s-3); }
      .outline-rail .workspace-row::before { content: ""; position: absolute; top: 16px; left: calc(var(--s-5) * -1); width: var(--s-4); border-top: var(--bw-hairline) solid var(--line-strong); }
      .outline-rail .workspace-row.active::before { border-color: var(--accent-line); }
      .chapter-project { margin-bottom: var(--s-8); }
      .chapter-project:last-child { margin-bottom: 0; }
      .chapter-project .project-header { min-height: 23px; padding: 0 var(--s-2); border-bottom: var(--bw-hairline) solid var(--line); }
      .chapter-project .project-heading { font-size: var(--fs-11); letter-spacing: .02em; }
      .chapter-project .project-count { margin-left: auto; }
      .chapter-workspace-list { padding-top: var(--s-2); }
      .chapter-workspace-list .workspace-row { padding: var(--s-2) var(--s-3) var(--s-2) var(--s-5); }
      .chapter-workspace-list .workspace-name { font-size: var(--fs-11); }
      .toast-rail { position: fixed; right: var(--s-8); bottom: var(--s-8); z-index: var(--z-toast); }
      .toast { display: flex; align-items: center; gap: var(--s-3); min-height: 32px; padding: 0 var(--s-4); border: var(--bw-hairline) solid var(--line-strong); border-radius: var(--r-4); background: var(--surface-elev); box-shadow: var(--shadow-3); color: var(--fg); font-size: var(--fs-11); animation: toast-in var(--dur-base) var(--ease-standard); }
      @keyframes toast-in { from { opacity: 0; transform: translateY(var(--s-2)); } to { opacity: 1; transform: translateY(0); } }
      @media (max-width: 980px) { .comparison-header { align-items: center; } .variant-tabs { display: flex; } .variant-grid { display: block; } .variant-card { display: none; max-width: 440px; margin: 0 auto; } .variant-card.visible { display: block; } }
      @media (max-width: 520px) { .comparison-page { padding: var(--s-6); } .comparison-note { display: none; } .sidebar-artboard { min-height: 590px; } }
    </style>
  </head>

    <div id="root"></div>
    <script>
      window.sidebarHierarchyCreateRoot = ReactDOM.createRoot;
      ReactDOM.createRoot = function () { return { render: function () {} }; };

    <script>ReactDOM.createRoot = window.sidebarHierarchyCreateRoot;</script>

    <script type="text/babel" src="app.jsx"></script>
  </body>
</html>
