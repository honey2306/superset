  <style>
    html,body,#root{height:100%}body{margin:0;background:var(--dracula-bg-deep);color:var(--dracula-fg);font-family:var(--font-ui)}button,textarea{font:inherit}.app{width:min(100%,430px);height:100dvh;margin:auto;display:flex;flex-direction:column;background:var(--dracula-bg-deep)}
    .bar{min-height:54px;padding:max(var(--s-8),env(safe-area-inset-top)) var(--s-10) var(--s-6);display:flex;align-items:center;gap:var(--s-6);border-bottom:var(--bw-hairline) solid var(--line);background:var(--dracula-bg)}.back{width:44px;height:44px;border:0;border-radius:var(--r-pill);background:transparent;color:var(--fg);font-size:var(--fs-22)}.identity{flex:1;min-width:0}.identity strong{display:block;font-size:var(--fs-14);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.identity small{display:block;margin-top:var(--s-1);color:var(--fg-mute);font:var(--fs-10)/1.3 var(--font-mono)}.connected{display:flex;align-items:center;gap:var(--s-2);color:var(--fg-mute);font-size:var(--fs-10)}.dot{width:7px;height:7px;border-radius:var(--r-pill);background:var(--success)}
    .terminal{flex:1;min-height:0;overflow:auto;padding:var(--s-12) var(--s-14);font:var(--fs-12)/1.62 var(--font-mono)}.terminal p{margin:0;white-space:pre-wrap}.pink{color:var(--dracula-pink)}.cyan{color:var(--dracula-cyan)}.green{color:var(--dracula-green)}.muted{color:var(--dracula-comment)}
    .dock{padding:var(--s-6) var(--s-10) max(var(--s-8),env(safe-area-inset-bottom));border-top:var(--bw-hairline) solid var(--line);background:var(--dracula-bg)}.keys{display:grid;grid-template-columns:repeat(8,minmax(42px,1fr));gap:var(--s-4);overflow-x:auto;padding-bottom:var(--s-6)}.key{height:34px;border:var(--bw-hairline) solid var(--line);border-radius:var(--r-2);background:var(--surface);color:var(--fg-mute);font:var(--fs-10)/1 var(--font-mono)}.input{display:flex;align-items:flex-end;min-height:46px;padding:var(--s-2);border:var(--bw-hairline) solid var(--line-strong);border-radius:var(--r-4);background:var(--surface)}textarea{flex:1;min-height:38px;max-height:100px;padding:var(--s-8);border:0;outline:0;resize:none;background:transparent;color:var(--fg);line-height:var(--lh-body)}textarea::placeholder{color:var(--fg-faint)}.send{width:38px;height:38px;border:0;border-radius:var(--r-pill);background:var(--fg);color:var(--page-bg);display:grid;place-items:center}.switcher{position:fixed;top:62px;left:50%;width:min(calc(100% - 20px),410px);transform:translateX(-50%);padding:var(--s-8);border:var(--bw-hairline) solid var(--line-strong);border-radius:var(--r-4);background:var(--surface-elev);box-shadow:var(--shadow-3);z-index:var(--z-dropdown)}.switcher button{width:100%;min-height:50px;border:0;border-radius:var(--r-3);background:transparent;color:var(--fg);display:flex;align-items:center;gap:var(--s-10);padding:var(--s-8);text-align:left}.switcher button:hover{background:var(--selected)}.switcher span{flex:1}.switcher small{display:block;color:var(--fg-mute);margin-top:var(--s-1)}

<body><div id="root"></div><script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script><script type="text/babel">
  const {Icon}=window.SupersetDesignSystem_91a6da;
  function TerminalFirst(){const [menuVisible,setMenuVisible]=React.useState(false);const [agentLabel,setAgentLabel]=React.useState('Codex');const [commandText,setCommandText]=React.useState('');return <main className="app"><header className="bar"><button className="back" aria-label="工作区">‹</button><button className="identity" onClick={()=>setMenuVisible(!menuVisible)} style={{border:0,background:'transparent',color:'inherit',textAlign:'left'}}><strong>{agentLabel}⌄</strong><small>main · ~/Code/superset</small></button><span className="connected"><i className="dot"/>online</span></header>{menuVisible&&<div className="switcher">{[['Codex','active now'],['Claude Code','idle · 18m'],['+ New agent','Claude Code, Codex, Gemini']].map(agentItem=><button key={agentItem[0]} onClick={()=>{if(!agentItem[0].startsWith('+'))setAgentLabel(agentItem[0]);setMenuVisible(false)}}><span>{agentItem[0]}<small>{agentItem[1]}</small></span><Icon name="arrowRight" size={16}/></button>)}</div>}<section className="terminal"><p className="muted">Superset workspace ready</p><p><span className="pink">➜</span> <span className="cyan">superset</span> bun run typecheck</p><p className="green">✓ @superset/web typecheck</p><p className="muted">Completed in 2.4s</p><p> </p><p><span className="pink">➜</span> <span className="cyan">superset</span> git diff --stat</p><p> apps/web/src/routes/terminal.tsx  | 82 ++++++</p><p> apps/web/src/routes/workspace.tsx | 94 +++++++</p><p> 2 files changed, 176 insertions(+)</p><p> </p><p><span className="pink">➜</span> <span className="cyan">superset</span> <span className="muted">▌</span></p></section><section className="dock"><div className="keys">{['Esc','Tab','Ctrl','⌃C','↑','↓','←','→'].map(keyLabel=><button key={keyLabel} className="key">{keyLabel}</button>)}</div><div className="input"><textarea rows="1" value={commandText} onChange={eventObject=>setCommandText(eventObject.target.value)} placeholder="输入命令…"/><button className="send" onClick={()=>setCommandText('')} aria-label="发送"><Icon name="arrowRight" size={17}/></button></div></section></main>}
  ReactDOM.createRoot(document.getElementById('root')).render(<TerminalFirst/>);
  </script></body>
