<!-- @dsCard group="Layout" viewport="720x320" name="TabbedWorkspace" subtitle="tab bar 34 · toolbar 32 · content 1fr · right panel 320-420" -->
<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="../../styles.css" />
  <link rel="stylesheet" href="../../components.css" />
</head>
<body>
  <div id="root" style="padding:16px 20px"></div>
  <script>
    const label = (t) => `<span style="font-family:var(--font-mono);font-size:10px;color:var(--fg-faint);letter-spacing:var(--ls-mono)">${t}</span>`;
    document.getElementById("root").innerHTML = `
      <div style="border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--page-bg)">
        <div style="height:34px;display:flex;align-items:center;gap:4px;padding:0 10px;border-bottom:1px solid var(--line);background:var(--surface)">
          <span style="padding:4px 10px;background:transparent;border-radius:6px;color:var(--fg);font-size:11px;font-family:var(--font-mono);position:relative">MainView.tsx
            <span style="position:absolute;left:8px;right:8px;bottom:-1px;height:2px;background:var(--accent-solid);border-radius:2px 2px 0 0"></span>
          </span>
          <span style="padding:4px 10px;color:var(--fg-mute);font-size:11px;font-family:var(--font-mono)">schema.ts</span>
          <span style="padding:4px 10px;color:var(--fg-mute);font-size:11px;font-family:var(--font-mono)">host.ts</span>
          <span style="margin-left:auto">${label("34px")}</span>
        </div>
        <div style="height:32px;display:flex;align-items:center;gap:6px;padding:0 10px;border-bottom:1px solid var(--line);background:color-mix(in oklch, var(--surface-elev) 40%, transparent)">
          <span style="width:14px;height:14px;background:var(--hover);border-radius:4px"></span>
          <span style="width:70px;height:14px;background:var(--hover);border-radius:4px"></span>
          <span style="margin-left:auto">${label("toolbar · 32px")}</span>
        </div>
        <div style="display:grid;grid-template-columns:1fr 340px;height:180px">
          <div style="padding:14px;display:flex;flex-direction:column;gap:6px">
            <div style="height:10px;background:var(--hover);border-radius:3px;width:80%"></div>
            <div style="height:10px;background:var(--hover);border-radius:3px;width:64%"></div>
            <div style="height:10px;background:var(--hover);border-radius:3px;width:72%"></div>
            <div style="margin-top:auto">${label("content · padding varies by pane")}</div>
          </div>
          <div style="border-left:1px solid var(--line);background:var(--surface);padding:14px;display:flex;flex-direction:column;justify-content:flex-end">
            ${label("right panel · 320-420 · snap-open")}
          </div>
        </div>
      </div>
    `;
  </script>
</body>
</html>
