<!-- @dsCard group="Desktop app" viewport="800x560" name="Paywall" subtitle="双栏 dialog · 5 feature 侧栏 · Pro 徽章 · CTA" -->
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="../../styles.css" />
  <link rel="stylesheet" href="../../components.css" />
  <link rel="stylesheet" href="../../app.css" />
</head>
<body>
  <div id="root" style="padding: 20px; display: flex; justify-content: center; background: color-mix(in oklch, var(--page-bg) 90%, #000 10%); min-height: 100%;"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { Icon, Button } = window.SupersetDesignSystem_91a6da;
    const pwFeatures = [
      { key: "remote", icon: "cloud", label: "Remote Workspaces" },
      { key: "invite", icon: "changes", label: "Team Collaboration" },
      { key: "tasks", icon: "check", label: "Tasks" },
      { key: "slack", icon: "spark", label: "Slack Integration" },
      { key: "mobile", icon: "max", label: "Mobile App", soon: true },
    ];
    function PwKit() {
      const [active, setActive] = React.useState("remote");
      const cur = pwFeatures.find((f) => f.key === active);
      return (
        <div className="paywall">
          <div className="paywall-cols">
            <div className="paywall-sidebar">
              <h1 className="paywall-title">Pro Features</h1>
              {pwFeatures.map((f) => (
                <button
                  className={
                    "paywall-feature" +
                    (f.key === active ? " is-active" : "")
                  }
                  key={f.key}
                  onClick={() => setActive(f.key)}
                >
                  <Icon name={f.icon} className="glyph" />
                  <span className="txt">
                    <span className="lbl">{f.label}</span>
                    {f.soon ? (
                      <span className="soon">Coming Soon</span>
                    ) : null}
                  </span>
                </button>
              ))}
            </div>
            <div className="paywall-preview">
              <div className="paywall-hero">
                <span>{cur.label}</span>
              </div>
              <div className="paywall-copy">
                <div className="head">
                  {cur.label}
                  <span className="paywall-badge-pro">PRO</span>
                  {cur.soon ? (
                    <span
                      className="paywall-badge-pro"
                      style={{
                        background: "transparent",
                        color: "var(--fg-faint)",
                      }}
                    >
                      COMING SOON
                    </span>
                  ) : null}
                </div>
                <div className="desc">
                  Run Superset workspaces on Anthropic-hosted infrastructure. Same
                  agents, same repos — freed from your laptop&rsquo;s battery and
                  network.
                </div>
              </div>
            </div>
          </div>
          <div className="paywall-cta">
            <Button>Cancel</Button>
            <Button variant="primary">Get Superset Pro</Button>
          </div>
        </div>
      );
    }
    const pwRoot = ReactDOM.createRoot(document.getElementById("root"));
    pwRoot.render(<PwKit />);
  </script>
</body>
</html>
