<!-- @dsCard group="Desktop app" viewport="640x460" name="NewWorkspaceModal" subtitle="name + branch · prompt · agent · project + base branch · ⌘↵" -->
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="../../styles.css" />
  <link rel="stylesheet" href="../../components.css" />
  <link rel="stylesheet" href="../../app.css" />
</head>
<body>
  <div id="root" style="padding: 24px; display: flex; justify-content: center; background: color-mix(in oklch, var(--page-bg) 90%, #000 10%); min-height: 100%;"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { Icon } = window.SupersetDesignSystem_91a6da;
    const nwRoot = ReactDOM.createRoot(document.getElementById("root"));
    nwRoot.render(
      <div className="nw-modal">
        <div className="nw-name-row">
          <input
            className="name"
            defaultValue="Fix pty shutdown race"
            placeholder="Workspace name (optional)"
          />
          <input
            className="branch"
            defaultValue="fix/pty-shutdown-race"
            placeholder="feat/new-branch"
          />
        </div>
        <div className="nw-composer">
          <div className="nw-linked">
            <span className="nw-linked-pill">
              <Icon name="pr" className="glyph" size={11} /> ENG-4213
            </span>
            <span className="nw-linked-pill">
              <Icon name="file" className="glyph" size={11} /> host-service-coordinator.ts
            </span>
          </div>
          <div
            className="nw-prompt"
            contentEditable
            suppressContentEditableWarning
          >
            host-service-coordinator 在 shutdown 时会死锁。复现步骤:开两个 pty,同时按 ⌘W。请修好并加测试。
          </div>
          <div className="nw-foot">
            <button className="pill-btn">
              <Icon name="spark" className="glyph" /> claude · sonnet 5
            </button>
            <button className="pill-btn">
              <Icon name="paperclip" className="glyph" />
            </button>
            <button className="pill-btn">
              <Icon name="pr" className="glyph" />
            </button>
            <span className="nw-hint">⌘ ↵ to create</span>
            <button
              className="send-btn"
              style={{ marginLeft: "auto", width: 22, height: 22 }}
            >
              <Icon name="arrowUp" className="glyph" size={12} />
            </button>
          </div>
        </div>
        <div
          style={{
            display: "flex",
            gap: 8,
            padding: "0 4px",
            alignItems: "center",
          }}
        >
          <button className="pill-btn">
            <span
              className="thumb"
              style={{
                width: 14,
                height: 14,
                borderRadius: 3,
                background: "color-mix(in oklch, var(--accent) 30%, var(--surface))",
                display: "inline-block",
              }}
            />
            superset
          </button>
          <button className="pill-btn">
            <Icon name="branch" className="glyph" /> base: main
          </button>
        </div>
      </div>,
    );
  </script>
</body>
</html>
