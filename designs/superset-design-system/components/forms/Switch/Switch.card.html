<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="../../../styles.css" />
  <link rel="stylesheet" href="../../../components.css" />
</head>
<body>
  <div id="root" style="padding:24px;display:flex;flex-direction:column;gap:12px"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

  <script src="../../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { Switch } = window.SupersetDesignSystem_91a6da;
    function Demo() {
      const [followHead, setFollowHead] = React.useState(true);
      const [autoFetch, setAutoFetch] = React.useState(false);
      const row = { display: "inline-flex", alignItems: "center", gap: 10, color: "var(--fg-mute)", fontSize: "var(--fs-11)" };
      return (
        <div style={{ display: "flex", gap: 24, flexWrap: "wrap", alignItems: "center" }}>
          <label style={row}><Switch checked={followHead} onChange={setFollowHead} /> Follow HEAD</label>
          <label style={row}><Switch checked={autoFetch} onChange={setAutoFetch} /> Auto-fetch every 5m</label>
          <label style={row}><Switch checked={true} /> Show hidden files</label>
        </div>
      );
    }
    const cardRoot = ReactDOM.createRoot(document.getElementById("root"));
    cardRoot.render(<Demo />);
  </script>
