<!-- @dsCard group="Colors" viewport="720x260" name="Semantic tokens" subtitle="surface / text / accent / status" -->
<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="../components.css" />
</head>
<body>
  <div style="padding:20px 24px;display:grid;grid-template-columns:repeat(2,1fr);gap:2px 16px;font-family:var(--font-ui);color:var(--fg);font-size:13px" id="root">
    <!-- Semantic token map, no logic — render as a static grid so the card is fast + snapshotable. -->
    <div class="stack" style="display:flex;flex-direction:column">
      <div style="padding:6px 0;display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:center;border-bottom:1px dashed var(--line)"><span style="width:22px;height:22px;border-radius:4px;background:var(--page-bg);border:1px solid var(--line)"></span><span class="mono">--page-bg</span><span class="mono faint">app background</span></div>
      <div style="padding:6px 0;display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:center;border-bottom:1px dashed var(--line)"><span style="width:22px;height:22px;border-radius:4px;background:var(--surface);border:1px solid var(--line)"></span><span class="mono">--surface</span><span class="mono faint">cards / editors</span></div>
      <div style="padding:6px 0;display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:center;border-bottom:1px dashed var(--line)"><span style="width:22px;height:22px;border-radius:4px;background:var(--surface-elev);border:1px solid var(--line)"></span><span class="mono">--surface-elev</span><span class="mono faint">raised inputs</span></div>
      <div style="padding:6px 0;display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:center"><span style="width:22px;height:22px;border-radius:4px;background:var(--surface-sunk);border:1px solid var(--line)"></span><span class="mono">--surface-sunk</span><span class="mono faint">popovers / menus</span></div>
    </div>
    <div class="stack" style="display:flex;flex-direction:column">
      <div style="padding:6px 0;display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:center;border-bottom:1px dashed var(--line)"><span style="width:22px;height:22px;border-radius:4px;background:var(--fg);border:1px solid var(--line)"></span><span class="mono">--fg</span><span class="mono faint">primary text</span></div>
      <div style="padding:6px 0;display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:center;border-bottom:1px dashed var(--line)"><span style="width:22px;height:22px;border-radius:4px;background:var(--fg-mute);border:1px solid var(--line)"></span><span class="mono">--fg-mute</span><span class="mono faint">secondary</span></div>
      <div style="padding:6px 0;display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:center;border-bottom:1px dashed var(--line)"><span style="width:22px;height:22px;border-radius:4px;background:var(--fg-faint);border:1px solid var(--line)"></span><span class="mono">--fg-faint</span><span class="mono faint">tertiary / captions</span></div>
      <div style="padding:6px 0;display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:center"><span style="width:22px;height:22px;border-radius:4px;background:var(--line);border:1px solid var(--line-strong)"></span><span class="mono">--line</span><span class="mono faint">hairlines</span></div>
    </div>
  </div>
</body>
</html>
