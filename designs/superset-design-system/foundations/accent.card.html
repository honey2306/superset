<!-- @dsCard group="Colors" viewport="720x220" name="Accent & status" subtitle="pink / purple / semantic states" -->
<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="../components.css" />
</head>
<body>
  <div style="padding:20px 24px;display:grid;grid-template-columns:repeat(2,1fr);gap:2px 16px;font-family:var(--font-ui);color:var(--fg);font-size:13px" id="root">
    <div>
      <div style="padding:6px 0;display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:center;border-bottom:1px dashed var(--line)"><span style="width:22px;height:22px;border-radius:4px;background:var(--accent);border:1px solid var(--line)"></span><span class="mono">--accent</span><span class="mono faint">brand pink</span></div>
      <div style="padding:6px 0;display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:center;border-bottom:1px dashed var(--line)"><span style="width:22px;height:22px;border-radius:4px;background:var(--accent-2);border:1px solid var(--line)"></span><span class="mono">--accent-2</span><span class="mono faint">brand purple</span></div>
      <div style="padding:6px 0;display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:center"><span style="width:22px;height:22px;border-radius:4px;background:var(--accent-tint);border:1px solid var(--line)"></span><span class="mono">--accent-tint</span><span class="mono faint">current-branch bg</span></div>
    </div>
    <div>
      <div style="padding:6px 0;display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:center;border-bottom:1px dashed var(--line)"><span style="width:22px;height:22px;border-radius:4px;background:var(--success);border:1px solid var(--line)"></span><span class="mono">--success</span><span class="mono faint">add / push OK</span></div>
      <div style="padding:6px 0;display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:center;border-bottom:1px dashed var(--line)"><span style="width:22px;height:22px;border-radius:4px;background:var(--warning);border:1px solid var(--line)"></span><span class="mono">--warning</span><span class="mono faint">modified / behind</span></div>
      <div style="padding:6px 0;display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:center;border-bottom:1px dashed var(--line)"><span style="width:22px;height:22px;border-radius:4px;background:var(--danger);border:1px solid var(--line)"></span><span class="mono">--danger</span><span class="mono faint">delete / errors</span></div>
      <div style="padding:6px 0;display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:center"><span style="width:22px;height:22px;border-radius:4px;background:var(--info);border:1px solid var(--line)"></span><span class="mono">--info</span><span class="mono faint">informational</span></div>
    </div>
  </div>
</body>
</html>
