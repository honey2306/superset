<!-- @dsCard group="Brand" viewport="720x180" name="Motion" subtitle="durations & easings" -->
<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <div style="padding:20px 24px;display:grid;grid-template-columns:1fr 1fr;gap:6px 32px;font-family:var(--font-mono);color:var(--fg-mute);font-size:var(--fs-11)">
    <div style="display:flex;justify-content:space-between"><span>--dur-instant</span><span style="color:var(--fg-faint)">80ms</span></div>
    <div style="display:flex;justify-content:space-between"><span>--ease-standard</span><span style="color:var(--fg-faint)">.2 .7 .3 1</span></div>
    <div style="display:flex;justify-content:space-between"><span>--dur-quick</span><span style="color:var(--fg-faint)">120ms</span></div>
    <div style="display:flex;justify-content:space-between"><span>--ease-out</span><span style="color:var(--fg-faint)">.16 1 .3 1</span></div>
    <div style="display:flex;justify-content:space-between"><span>--dur-base</span><span style="color:var(--fg-faint)">180ms</span></div>
    <div style="display:flex;justify-content:space-between"><span>--ease-in</span><span style="color:var(--fg-faint)">.7 0 .84 0</span></div>
    <div style="display:flex;justify-content:space-between"><span>--dur-slow</span><span style="color:var(--fg-faint)">260ms</span></div>
    <div style="display:flex;justify-content:space-between"><span>--ease-emphatic</span><span style="color:var(--fg-faint)">.34 1.56 .64 1</span></div>
  </div>
</body>
</html>
