<!-- @dsCard group="Spacing" viewport="720x140" name="Spacing scale" subtitle="4-based, with 2/6/10 half-steps" -->
<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <div style="padding:20px 24px;display:flex;align-items:flex-end;gap:6px;font-family:var(--font-mono);color:var(--fg-mute);font-size:var(--fs-10);color:var(--fg-faint)">
    <div style="display:flex;flex-direction:column;align-items:center;gap:2px"><div style="width:4px;height:12px;background:var(--accent-tint);border:1px solid var(--accent-line);border-radius:2px"></div><span>4</span><span style="opacity:0.5">--s-2</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:2px"><div style="width:6px;height:12px;background:var(--accent-tint);border:1px solid var(--accent-line);border-radius:2px"></div><span>6</span><span style="opacity:0.5">--s-3</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:2px"><div style="width:8px;height:12px;background:var(--accent-tint);border:1px solid var(--accent-line);border-radius:2px"></div><span>8</span><span style="opacity:0.5">--s-4</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:2px"><div style="width:12px;height:12px;background:var(--accent-tint);border:1px solid var(--accent-line);border-radius:2px"></div><span>12</span><span style="opacity:0.5">--s-6</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:2px"><div style="width:16px;height:12px;background:var(--accent-tint);border:1px solid var(--accent-line);border-radius:2px"></div><span>16</span><span style="opacity:0.5">--s-8</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:2px"><div style="width:24px;height:12px;background:var(--accent-tint);border:1px solid var(--accent-line);border-radius:2px"></div><span>24</span><span style="opacity:0.5">--s-12</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:2px"><div style="width:32px;height:12px;background:var(--accent-tint);border:1px solid var(--accent-line);border-radius:2px"></div><span>32</span><span style="opacity:0.5">--s-16</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:2px"><div style="width:48px;height:12px;background:var(--accent-tint);border:1px solid var(--accent-line);border-radius:2px"></div><span>48</span><span style="opacity:0.5">--s-24</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:2px"><div style="width:64px;height:12px;background:var(--accent-tint);border:1px solid var(--accent-line);border-radius:2px"></div><span>64</span><span style="opacity:0.5">--s-32</span></div>
  </div>
</body>
</html>
