<!-- @dsCard group="Spacing" viewport="720x140" name="Radius scale" subtitle="3 → 14 → pill" -->
<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <div style="padding:22px 24px;display:flex;align-items:center;gap:14px;font-family:var(--font-mono);color:var(--fg-faint);font-size:var(--fs-10)">
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px"><div style="width:44px;height:44px;background:var(--surface-elev);border:1px solid var(--line-strong);border-radius:var(--r-2)"></div><span>4px</span><span style="opacity:0.6">--r-2</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px"><div style="width:44px;height:44px;background:var(--surface-elev);border:1px solid var(--line-strong);border-radius:var(--r-3)"></div><span>6px</span><span style="opacity:0.6">--r-3</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px"><div style="width:44px;height:44px;background:var(--surface-elev);border:1px solid var(--line-strong);border-radius:var(--r-4)"></div><span>8px</span><span style="opacity:0.6">--r-4</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px"><div style="width:44px;height:44px;background:var(--surface-elev);border:1px solid var(--line-strong);border-radius:var(--r-5)"></div><span>10px</span><span style="opacity:0.6">--r-5</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px"><div style="width:44px;height:44px;background:var(--surface-elev);border:1px solid var(--line-strong);border-radius:var(--r-6)"></div><span>12px</span><span style="opacity:0.6">--r-6</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px"><div style="width:44px;height:44px;background:var(--surface-elev);border:1px solid var(--line-strong);border-radius:var(--r-7)"></div><span>14px</span><span style="opacity:0.6">--r-7</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px"><div style="width:44px;height:22px;background:var(--surface-elev);border:1px solid var(--line-strong);border-radius:var(--r-pill)"></div><span>pill</span><span style="opacity:0.6">--r-pill</span></div>
  </div>
</body>
</html>
