<!-- @dsCard group="Brand" viewport="720x180" name="Shadow scale" subtitle="1 → 4, dark-mode calibrated" -->
<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <div style="padding:24px;display:grid;grid-template-columns:repeat(4,1fr);gap:16px;font-family:var(--font-mono);color:var(--fg-faint);font-size:var(--fs-10)">
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px"><div style="width:120px;height:56px;background:var(--surface-elev);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-1)"></div><span>--shadow-1</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px"><div style="width:120px;height:56px;background:var(--surface-elev);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-2)"></div><span>--shadow-2</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px"><div style="width:120px;height:56px;background:var(--surface-elev);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-3)"></div><span>--shadow-3</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px"><div style="width:120px;height:56px;background:var(--surface-elev);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-4)"></div><span>--shadow-4</span></div>
  </div>
</body>
</html>
