		<style>
			.memory-app { --memory-hover: color-mix(in oklch, var(--info) 6%, transparent); --memory-selected: color-mix(in oklch, var(--info) 11%, var(--surface)); --memory-line: color-mix(in oklch, var(--info) 38%, var(--line)); width: 1160px; height: 760px; display: grid; grid-template-columns: 196px 1fr; overflow: hidden; background: var(--page-bg); color: var(--fg); font-family: var(--font-ui); border-radius: var(--r-4); }
			.global-sidebar { background: color-mix(in oklch, var(--surface) 58%, var(--page-bg)); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: var(--s-5) var(--s-3); min-height: 0; }
			.global-sidebar__nav { display: flex; flex-direction: column; gap: var(--s-2); padding-bottom: var(--s-5); border-bottom: 1px solid var(--line); }
			.global-nav { display: flex; align-items: center; gap: var(--s-4); height: 30px; padding: 0 var(--s-4); border-radius: var(--r-3); color: var(--fg-mute); font-size: var(--fs-12); cursor: pointer; transition: background var(--dur-quick) var(--ease-standard), color var(--dur-quick) var(--ease-standard); }
			.global-nav:hover { background: var(--memory-hover); color: var(--fg); }
			.global-nav.is-active { background: var(--memory-selected); color: var(--fg); }
			.global-nav.is-active svg { color: var(--info); }
			.global-sidebar__projects { flex: 1; overflow: hidden; padding-top: var(--s-5); }
			.global-sidebar__label { padding: 0 var(--s-4) var(--s-3); color: var(--fg-faint); font-size: var(--fs-10); letter-spacing: var(--ls-eyebrow); text-transform: uppercase; }
			.global-project { display: flex; align-items: center; gap: var(--s-4); height: 30px; padding: 0 var(--s-4); color: var(--fg-mute); font-size: var(--fs-12); }
			.global-project__mark { width: 17px; height: 17px; display: inline-flex; align-items: center; justify-content: center; border-radius: var(--r-2); background: var(--surface-elev); font-family: var(--font-mono); font-size: var(--fs-9); }
			.global-sidebar__foot { display: flex; align-items: center; gap: var(--s-3); padding: var(--s-4); border-top: 1px solid var(--line); color: var(--fg-faint); font-family: var(--font-mono); font-size: var(--fs-10); }
			.memory-page { display: grid; grid-template-columns: 218px 1fr; min-width: 0; min-height: 0; }
			.project-rail { border-right: 1px solid var(--line); background: color-mix(in oklch, var(--surface) 32%, var(--page-bg)); display: flex; flex-direction: column; min-height: 0; }
			.project-rail__head { padding: var(--s-6); border-bottom: 1px solid var(--line); }
			.project-rail__eyebrow { color: var(--fg-faint); font-size: var(--fs-10); letter-spacing: var(--ls-eyebrow); text-transform: uppercase; }
			.project-rail__title { margin-top: var(--s-2); font-size: var(--fs-16); font-weight: var(--fw-semibold); }
			.project-rail__search { padding: var(--s-4); border-bottom: 1px solid var(--line); }
			.project-list { padding: var(--s-3); display: flex; flex-direction: column; gap: var(--s-2); overflow: auto; }
			.project-row { display: grid; grid-template-columns: 24px 1fr auto; gap: var(--s-4); align-items: center; padding: var(--s-4); border-radius: var(--r-3); color: var(--fg-mute); cursor: pointer; transition: background var(--dur-quick) var(--ease-standard), color var(--dur-quick) var(--ease-standard); }
			.project-row:hover { background: var(--memory-hover); color: var(--fg); }
			.project-row.is-active { background: var(--memory-selected); color: var(--fg); box-shadow: inset 2px 0 0 var(--info); }
			.project-row__mark { width: 24px; height: 24px; border-radius: var(--r-3); background: var(--hover); border: 1px solid var(--line); display: inline-flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: var(--fs-10); }
			.project-row__name { font-size: var(--fs-12); font-weight: var(--fw-medium); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
			.project-row__meta { margin-top: 1px; color: var(--fg-faint); font-family: var(--font-mono); font-size: var(--fs-9); }
			.project-row__count { color: var(--fg-faint); font-family: var(--font-mono); font-size: var(--fs-10); }
			.memory-content { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
			.page-head { padding: var(--s-6) var(--s-8) var(--s-5); background: var(--surface); border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: var(--s-5); }
			.page-head__top { display: flex; align-items: center; gap: var(--s-5); }
			.page-title { margin: 0; font-size: var(--fs-18); font-weight: var(--fw-semibold); letter-spacing: var(--ls-title); }
			.page-count { color: var(--fg-mute); font-family: var(--font-mono); font-size: var(--fs-11); }
			.page-spacer { flex: 1; }
			.toolbar { display: flex; align-items: center; gap: var(--s-3); }
			.search-shell { width: 260px; }
			.memory-app .input, .memory-app .ds-textarea { background: var(--surface); border-color: var(--line-strong); }
			.memory-scroll { flex: 1; overflow: auto; padding: var(--s-6) var(--s-8) var(--s-8); }
			.filter-row { display: flex; align-items: center; gap: var(--s-3); }
			.filter-pill { border: 1px solid var(--line); background: transparent; color: var(--fg-mute); border-radius: var(--r-pill); padding: 3px var(--s-5); font-size: var(--fs-11); cursor: pointer; }
			.filter-pill:hover { color: var(--fg); background: var(--memory-hover); border-color: var(--memory-line); }
			.filter-pill.is-active { color: var(--fg); background: var(--memory-selected); border-color: var(--memory-line); }
			.memory-list { display: flex; flex-direction: column; gap: var(--s-3); }
			.memory-row { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: var(--s-5); padding: var(--s-5) var(--s-6); border: 1px solid var(--line); border-radius: var(--r-4); background: var(--surface); cursor: pointer; transition: border-color var(--dur-quick) var(--ease-standard), background var(--dur-quick) var(--ease-standard); }
			.memory-row:hover { background: var(--memory-hover); border-color: var(--memory-line); }
			.memory-row.is-selected { background: var(--memory-selected); border-color: var(--memory-line); box-shadow: 0 0 0 1px color-mix(in oklch, var(--info) 10%, transparent); }
			.memory-row__pin { color: var(--fg-faint); padding-top: 2px; }
			.memory-row__pin.is-pinned { color: var(--accent); }
			.memory-row__title { display: flex; align-items: center; gap: var(--s-3); font-size: var(--fs-13); font-weight: var(--fw-semibold); }
			.memory-row__body { margin-top: var(--s-2); color: var(--fg-mute); font-size: var(--fs-12); line-height: var(--lh-body); max-width: 720px; }
			.memory-row__meta { margin-top: var(--s-4); display: flex; align-items: center; gap: var(--s-4); color: var(--fg-faint); font-size: var(--fs-10); }
			.memory-row__source { display: inline-flex; align-items: center; gap: var(--s-2); font-family: var(--font-mono); }
			.memory-row__actions { display: flex; align-items: flex-start; gap: var(--s-2); color: var(--fg-faint); }
			.category { display: inline-flex; align-items: center; gap: var(--s-2); padding: 2px var(--s-3); border-radius: var(--r-pill); background: var(--hover); color: var(--fg-mute); font-size: var(--fs-10); }
			.category::before { content: ""; width: 5px; height: 5px; border-radius: var(--r-pill); background: var(--fg-faint); }
			.category.debugging::before { background: var(--warning); }
			.category.architecture::before { background: var(--accent-2); }
			.category.workflow::before { background: var(--info); }
			.category.preference::before { background: var(--accent); }
			.memory-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s-4); }
			.memory-card { min-height: 196px; display: flex; flex-direction: column; padding: var(--s-6); border: 1px solid var(--line); border-radius: var(--r-6); background: var(--surface); transition: background var(--dur-quick) var(--ease-standard), border-color var(--dur-quick) var(--ease-standard); cursor: pointer; }
			.memory-card:hover { background: var(--surface-elev); border-color: var(--line-strong); }
			.memory-card__top { display: flex; align-items: center; gap: var(--s-3); }
			.memory-card__body { margin-top: var(--s-5); color: var(--fg-mute); font-size: var(--fs-12); line-height: var(--lh-loose); }
			.memory-card__foot { margin-top: auto; padding-top: var(--s-5); display: flex; align-items: center; gap: var(--s-3); color: var(--fg-faint); font-size: var(--fs-10); border-top: 1px solid var(--line); }
			.timeline { position: relative; display: flex; flex-direction: column; gap: var(--s-6); padding-left: var(--s-6); }
			.timeline::before { content: ""; position: absolute; top: 8px; bottom: 8px; left: 7px; width: 1px; background: var(--line-strong); }
			.timeline-group { position: relative; }
			.timeline-group::before { content: ""; position: absolute; left: -22px; top: 7px; width: 7px; height: 7px; border-radius: var(--r-pill); background: var(--accent); box-shadow: 0 0 0 4px var(--accent-tint); }
			.timeline-time { color: var(--fg-faint); font-family: var(--font-mono); font-size: var(--fs-10); margin-bottom: var(--s-3); }
			.timeline-card { padding: var(--s-5) var(--s-6); border: 1px solid var(--line); border-radius: var(--r-5); background: var(--surface); }
			.timeline-card__head { display: flex; align-items: center; gap: var(--s-3); }
			.timeline-card__body { margin-top: var(--s-3); color: var(--fg-mute); font-size: var(--fs-12); line-height: var(--lh-body); }
			.timeline-context { margin-top: var(--s-4); padding: var(--s-4); border-radius: var(--r-3); background: var(--surface-sunk); color: var(--fg-faint); font-family: var(--font-mono); font-size: var(--fs-10); }
			.editor-panel { margin-top: var(--s-4); padding: var(--s-5); border: 1px solid var(--memory-line); border-radius: var(--r-5); background: color-mix(in oklch, var(--info) 5%, var(--surface)); box-shadow: 0 0 0 1px color-mix(in oklch, var(--info) 9%, transparent); }
			.editor-panel__fields { display: grid; gap: var(--s-4); }
			.editor-panel__actions { display: flex; align-items: center; gap: var(--s-3); margin-top: var(--s-4); }
			.variant-note { padding: var(--s-4) var(--s-5); border: 1px solid var(--line); border-radius: var(--r-4); background: var(--surface); color: var(--fg-mute); font-size: var(--fs-11); }
