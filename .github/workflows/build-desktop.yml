name: Build Desktop App

on:
  workflow_call:
    inputs:
      electron_builder_config:
        description: Electron Builder config file
        required: false
        type: string
        default: electron-builder.ts
      artifact_prefix:
        description: Artifact name prefix
        required: false
        type: string
        default: desktop
      artifact_retention_days:
        description: Artifact retention in days
        required: false
        type: number
        default: 30

jobs:
  build-macos-arm64:
    name: Build - macOS (arm64)
    runs-on: macos-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        id: setup-bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Cache dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ steps.setup-bun.outputs.bun-revision }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-bun-${{ steps.setup-bun.outputs.bun-revision }}-

      - name: Install dependencies
        env:
          BUN_CONFIG_REGISTRY: https://registry.npmjs.org
        run: bun install --frozen --ignore-scripts --registry https://registry.npmjs.org

      - name: Install desktop native dependencies
        working-directory: apps/desktop
        run: bun run install:deps

      - name: Generate file icons
        working-directory: apps/desktop
        run: bun run generate:icons

      - name: Compile app
        working-directory: apps/desktop
        env:
          NEXT_PUBLIC_WEB_URL: ${{ secrets.NEXT_PUBLIC_WEB_URL }}
          NEXT_PUBLIC_DOCS_URL: ${{ secrets.NEXT_PUBLIC_DOCS_URL }}
          AUTOMATE_RELAY_URL: ${{ secrets.AUTOMATE_RELAY_URL }}
          SUPERSET_WORKSPACE_NAME: superset
          SUPERSET_UPDATE_REPOSITORY: ${{ github.repository }}
          TARGET_ARCH: arm64
        run: bun run compile:app

      - name: Build arm64 macOS artifacts
        working-directory: apps/desktop
        env:
          MAC_CERTIFICATE: ${{ secrets.MAC_CERTIFICATE }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          MAC_APPLE_ID: ${{ secrets.APPLE_ID }}
          MAC_APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          MAC_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SUPERSET_UPDATE_REPOSITORY: ${{ github.repository }}
          TARGET_ARCH: arm64
        run: |
          if [[ -n "$MAC_CERTIFICATE" && -n "$MAC_CERTIFICATE_PASSWORD" ]]; then
            export CSC_LINK="$MAC_CERTIFICATE"
            export CSC_KEY_PASSWORD="$MAC_CERTIFICATE_PASSWORD"
          else
            echo "Building unsigned DMG: macOS signing credentials are unavailable."
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi

          if [[ -n "$MAC_APPLE_ID" && -n "$MAC_APPLE_ID_PASSWORD" && -n "$MAC_APPLE_TEAM_ID" ]]; then
            export APPLE_ID="$MAC_APPLE_ID"
            export APPLE_APP_SPECIFIC_PASSWORD="$MAC_APPLE_ID_PASSWORD"
            export APPLE_TEAM_ID="$MAC_APPLE_TEAM_ID"
          else
            echo "Skipping notarization: Apple notarization credentials are unavailable."
          fi

          bun run package -- --publish never --config ${{ inputs.electron_builder_config }} --mac dmg zip --arm64

      - name: Verify macOS updater artifacts
        working-directory: apps/desktop
        run: |
          test -n "$(find release -maxdepth 1 -name '*.dmg' -type f -print -quit)"
          test -n "$(find release -maxdepth 1 -name '*.zip' -type f -print -quit)"
          test -f release/latest-mac.yml

      - name: Upload macOS release and updater artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.artifact_prefix }}-mac-arm64
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest-mac.yml
          retention-days: ${{ inputs.artifact_retention_days }}
          if-no-files-found: error
