name: Release Desktop App

on:
  push:
    tags:
      - "desktop-v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build-desktop.yml
    with:
      electron_builder_config: electron-builder.ts
      artifact_prefix: desktop
      artifact_retention_days: 30
    secrets: inherit

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/desktop-v')

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Download macOS release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-artifacts
          pattern: desktop-mac-arm64
          merge-multiple: true

      - name: Verify updater assets
        run: |
          DMG=$(find release-artifacts -maxdepth 1 -name '*.dmg' -type f -print -quit)
          ZIP=$(find release-artifacts -maxdepth 1 -name '*.zip' -type f -print -quit)
          test -n "$DMG"
          test -n "$ZIP"
          test -f release-artifacts/latest-mac.yml
          ls -lh release-artifacts

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/releases/generate-notes \
            -f tag_name="${{ github.ref_name }}" \
            --jq '.body' > release-notes.md

      - name: Create draft release with updater assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            release-artifacts/* \
            --title "Superset Desktop ${{ github.ref_name }}" \
            --notes-file release-notes.md \
            --draft
