*{box-sizing:border-box}body{margin:0;background:#efefed;color:#252629;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}button{font:inherit;cursor:pointer;color:inherit}button:focus-visible{outline:2px solid #a78bfa;outline-offset:2px}button{border:0;background:none}header.review{max-width:1190px;margin:44px auto 28px;padding:0 24px}.eyebrow{font-size:10px;letter-spacing:2.5px;color:#777a7c;font-weight:600}h1{font-size:29px;letter-spacing:-1px;margin:12px 0}header.review p{color:#74767a;line-height:1.8;margin:0}.toolbar{display:flex;gap:8px;margin-top:20px;align-items:center}.toolbar button{padding:8px 14px;border:1px solid #d6d7d6;border-radius:7px;background:#f9f9f7;font-size:12px}.toolbar button.on{background:#282a30;color:white;border-color:#282a30}.toolbar small{margin-left:auto;color:#777}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));max-width:1190px;margin:auto;padding:0 24px;gap:28px}.label{display:flex;align-items:center;gap:10px;margin-bottom:12px}.letter{display:grid;place-items:center;border:1px solid #c9cbca;border-radius:6px;width:27px;height:27px;font:12px ui-monospace,monospace}.label b{font-size:16px}.label span:last-child{margin-left:auto;font-size:10px;color:#777}.shell{--bg:#202126;--panel:#25262c;--line:#37383e;--fg:#e7e7ec;--muted:#999ba6;--hover:#303138;--accent:#c1adf2;--tint:#b99aec18;height:724px;background:var(--bg);color:var(--fg);border:1px solid #3b3b42;border-radius:12px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 12px 30px #15152113}.light .shell{--bg:#fafafa;--panel:#f0f0f3;--line:#dedee5;--fg:#272831;--muted:#777986;--hover:#ececf1;--accent:#7850b4;--tint:#a578d916;border-color:#d6d6dc}.chrome{height:42px;display:flex;align-items:center;padding:0 15px;gap:6px;border-bottom:1px solid var(--line);flex-shrink:0}.chrome i{width:8px;height:8px;border-radius:50%;background:#686971}.chrome span{margin-left:auto;font-size:10px;color:var(--muted)}.account{display:flex;align /* Direction D: flat project navigation, sticky category strips. */

<header class="review"><div class="eyebrow">SUPERSET / SIDEBAR EXPLORATIONS</div><h1>项目，一眼可见。</h1><p>四个布局方向 · 单工作区直接进入 · 多项目同时可见</p><div class="toolbar"><button type="button" class="on" data-view="all">四版对比</button><button type="button" data-view="a">A 清晰分组</button><button type="button" data-view="b">B 分类侧轨</button><button type="button" data-view="c">C 紧凑工作台</button><button type="button" data-view="d">D 项目直达</button><button type="button" id="theme">切换浅色</button><small>可点击项目切换选中态 · 点击「2 ›」展开多工作区</small></div></header><main class="grid" id="grid"></main><div class="note"><div><strong>统一示例</strong><br>3 个分类 / 12 个项目 / 仅一个项目有多个工作区。项目名称与状态均为演示数据。</div><div><strong>交互原则</strong><br>项目直接进入；状态随项目呈现。分类保持展开，不加入搜索、置顶或自动折叠。</div><div><strong>比较重点</strong><br>A 看层级，B 看分类归属，C 看一屏容量，D 平衡密度与可读性。预览高度一致，便于比较。</div></div><footer class="review-footer">设计预览 · 不连接真实项目或运行状态</footer><div class="toast" role="status"></div>
<script>
const icons={workflow:'<rect x="3" y="3" width="6" height="6" rx="1"/><rect x="15" y="15" width="6" height="6" rx="1"/><path d="M6 9v9h9"/>',todo:'<path d="m3 6 2 2 3-4M11 6h10M3 13h5M11 13h10M3 20h5M11 20h10"/>',clock:'<circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/>',brain:'<path d="M9 4a3 3 0 0 0-5 3 4 4 0 0 0-1 7 4 4 0 0 0 6 5V4ZM15 4a3 3 0 0 1 5 3 4 4 0 0 1 1 7 4 4 0 0 1-6 5V4Z"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="m9 3-1 3-3 1-2 3 2 2-1 3 3 3 3-1 2 2 3-1 1-3 3-1 1-3-2-2 1-3-3-2-3 1Z"/>'};const svg=k=>`<svg viewBox="0 0 24 24" aria-hidden="true">${icons[k]}</svg>`;
const groups=[{name:'产品研发',color:'#b8a1da',items:[['Superset','Su','运行中'],['Flicker','Fl','待处理'],['Knowledge','Kn',''],['Agent Studio','As','',true]]},{name:'业务项目',color:'#89b5aa',items:[['客户管理','Cr','运行中'],['数据看板','Da',''],['开放平台','Op',''],['官网','We','']]},{name:'个人实验',color:'#c3a87a',items:[['Local Tools','Lt',''],['Prompt Lab','Pl','待处理'],['Notes','No',''],['Playground','Pg','']]}];
const defs=[['a','清晰分组','舒展 · 熟悉','轻量层级，保持熟悉感','分类用留白和小标题分隔；项目一行直达，状态靠右。最接近当前侧栏，减少重复层级。'],['b','分类侧轨','归属更明确','沿着分类轨道，连续浏览','细色轨贯穿整个分类，名称与内容形成完整区块；减少图标重量，项目列表更连贯。'],['c','紧凑工作台','更多项目同屏','紧凑排布，边界分明','分类有独立标题底色和细边框；行距更紧，工具入口两列排列，给项目留出更多纵向空间。']];
for(const [id,title,tag,cap,desc] of defs){const sections=groups.map((g,gi)=>`<section class="group" style="--group:${g.color}"><div class="group-title"><span class="mark"></span>${g.name}<em>04</em></div>${g.items.map((p,pi)=>`<div><button type="button" class="row ${gi===0&&pi===0?'selected':''}" data-project="${p[0]}" aria-pressed="${gi===0&&pi===0}"><span class="project-icon">${p[1]}</span><span class="name">${p[0]}</span><span class="status ${p[2]==='待处理'?'wait':''}">${p[2]?`<span class="dot"></span>${p[2]}`:''}</span>${p[3]?'<span class="chevron" role="button" tabindex="0" aria-label="展开 Agent Studio 的工作区" aria-expanded="false">2 ›</span>':''}</button>${p[3]?'<div class="subrows"><button type="button" data-project="Agent Studio / main">⑂ main <span style="float:right">当前</span></button><button type="button" data-project="Agent Studio / experiment">⑂ experiment</button></div>':''}</div>`).join('')}</section>`).join('');document.querySelector('#grid').insertAdjacentHTML('beforeend',`<article id="${id}"><div class="label"><span class="letter">${id.toUpperCase()}</span><b>${title}</b><span>${tag}</span></div><div class="shell ${id}"><div class="chrome"><i></i><i></i><i></i><span>Superset</span></div><div class="account"><span class="avatar">W</span><div><b>我的空间</b><small>Personal workspace</small></div><span class="right">⌄</span></div><nav class="nav">${[['workflow','自动化'],['todo','待办'],['clock','临时'],['brain','上下文']].map(([k,t])=>`<button type="button" data-demo="${t}">${svg(k)}<span>${t}</span></button>`).join('')}</nav><div class="area-head"><b>项目 <span style="opacity:.6;margin-left:5px">12</span></b><button type="button" data-demo="添加项目" aria-label="添加项目">＋</button></div><div class="projects">${sections}</div><div class="foot"><button type="button" data-demo="设置" aria-label="设置">${svg('settings')}</button><span>本地主机</span><span class="connected"><span class="dot"></span> 已连接</span></div></div><p class="caption">${cap}</p><p class="description">${desc}</p></article>`)}
let timer;function toast(s){const el=document.querySelector('.toast');el.textContent=s;el.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>el.classList.remove('show'),1800)}document.addEventListener('click',e=>{const ch=e.target.closest('.chevron');if(ch){const sub=ch.closest('.row').nextElementSibling;sub.classList.toggle('open');ch.textContent=sub.classList.contains('open')?'2 ⌄':'2 ›';ch.setAttribute('aria-expanded',String(sub.classList.contains('open')));return}const p=e.target.closest('[data-project]');if(p){const shell=p.closest('.shell');shell.querySelectorAll('.row').forEach(r=>{r.classList.remove('selected');r.setAttribute('aria-pressed','false')});const row=p.classList.contains('row')?p:p.closest('.subrows').previousElementSibling;row.classList.add('selected');row.setAttribute('aria-pressed','true');toast(`已选择 ${p.dataset.project} · 演示预览`);return}const d=e.target.closest('[data-demo]');if(d)toast(`${d.dataset.demo} · 布局示意`);const v=e.target.closest('[data-view]');if(v){document.body.classList.toggle('focused',v.dataset.view!=='all');document.querySelectorAll('article').forEach(a=>{a.classList.toggle('focus',a.id===v.dataset.view)});document.querySelectorAll('[data-view]').forEach(b=>{b.classList.toggle('on',b===v)})}});document.addEventListener('keydown',e=>{if(e.target.matches('.chevron')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();e.target.click()}});document.querySelector('#theme').onclick=()=>{document.body.classList.toggle('light');document.querySelector('#theme').textContent=document.body.classList.contains('light')?'切换深色':'切换浅色'};

// Preserve the first three directions and add a independently styled fourth.
const dArticle=document.querySelector('#a').cloneNode(true);dArticle.id='d';dArticle.querySelector('.shell').className='shell d';
dArticle.querySelector('.letter').textContent='D';dArticle.querySelector('.label b').textContent='项目直达';dArticle.querySelector('.label span:last-child').textContent='轻量 · 连续列表';
dArticle.querySelector('.caption').textContent='轻分组，连续的项目列表';dArticle.querySelector('.description').textContent='分类标题左对齐，项目文字向右缩进 14px，去掉项目前的图标。保留轻量分组、34px 行高和分类吸顶。';
dArticle.querySelectorAll('.row').forEach(row=>{const wrap=row.parentElement;wrap.classList.add('row-wrap');const menu=document.createElement('button');menu.className='row-menu';menu.textContent='⋯';menu.setAttribute('aria-label',`${row.dataset.project} 项目操作`);menu.setAttribute('aria-haspopup','menu');menu.setAttribute('aria-expanded','false');wrap.append(menu)});
document.querySelector('#grid').append(dArticle);
const pm=document.createElement('div');pm.className='project-menu';pm.hidden=true;pm.setAttribute('role','menu');document.body.append(pm);let menuAnchor;
function closeProjectMenu(){pm.hidden=true;menuAnchor?.setAttribute('aria-expanded','false')}
document.addEventListener('click',e=>{const m=e.target.closest('.row-menu');if(m){closeProjectMenu();menuAnchor=m;const name=m.parentElement.querySelector('.row').dataset.project;pm.innerHTML='<small></small><button type="button" role="menuitem">新建工作区</button><button type="button" role="menuitem">项目设置</button><button type="button" role="menuitem">移动到分类…</button>';pm.querySelector('small').textContent=name;pm.hidden=false;m.setAttribute('aria-expanded','true');const r=m.getBoundingClientRect();pm.style.left=`${Math.min(r.right-168,window.innerWidth-180)}px`;pm.style.top=`${Math.min(r.bottom+5,window.innerHeight-165)}px`;return}if(e.target.closest('.project-menu button'))toast(`${e.target.textContent} · 布局示意`);closeProjectMenu()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeProjectMenu();menuAnchor?.focus()}});
document.querySelector('[data-view="d"]').click();
</script></body></html>
